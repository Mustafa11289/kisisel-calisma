    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
            h1 {color: #89b4fa; margin-bottom: 5px;}
            h2 {color:#f5c2e7; margin-top: 25px; border-bottom: 1px solid#45475a; padding-bottom: 5px;}
            
            /* kart yapısı */
            .card {
                background-color: #313244;
                padding: 15px;
                border-radius: 8px;
                margin-top: 10px;
            }

            /* liste stilleri */
            ul {list-style-type: square; padding-left: 20px;}
            li {margin-bottom: 5px;}

            /* form elemanları */
            .input-group {
                display: flex;
                gap: 10px;
                margin-top: 10px;
            }
                input[type=email]{
                    flex: 1;
                    padding: 10px;
                    border-radius: 6px;
                    border: 1px solid #45475a;
                    background-color: #313244;
                    color: #ffffff;
                }
            button {
                background-color: #89b4fa;
                border: none;
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
                font-weight: bold;
                transition: 0.2s;
            }

            button:hover {
                background-color: #b4befe;
            }

            /**link stilleri*/
            a {
                color: #89b4fa;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }
    </style>

</head>
